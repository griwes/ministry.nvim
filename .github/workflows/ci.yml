name: ci

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: JohnnyMorganz/stylua-action@v4
              with:
                  version: latest
                  token: ${{ secrets.GITHUB_TOKEN }}
                  args: --check .

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: rhysd/action-setup-vim@v1
              with:
                  neovim: true
                  version: stable
            - name: Run tests
              run: scripts/ci/test.sh

    legate-compatibility:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            MINISTRY_NVIM_PATH: ${{ github.workspace }}
            TERMINALIA_NVIM_PATH: ${{ github.workspace }}/.dependencies/terminalia.nvim
        steps:
            - uses: actions/checkout@v4
            - uses: actions/checkout@v4
              with:
                  repository: griwes/legate.nvim
                  ref: main
                  path: .dependencies/legate.nvim
            - uses: actions/checkout@v4
              with:
                  repository: griwes/terminalia.nvim
                  ref: main
                  path: .dependencies/terminalia.nvim
            - uses: rhysd/action-setup-vim@v1
              with:
                  neovim: true
                  version: stable
            - name: Run Legate against this Ministry checkout
              working-directory: .dependencies/legate.nvim
              run: scripts/ci/test.sh
